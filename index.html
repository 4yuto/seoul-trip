<title>ソウル旅 10/9–10/12</title>
<meta name="apple-mobile-web-app-title" content="ソウル旅">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: phone-first app shell — sticky trip header, one panel per tab, bottom tab bar like a boarding pass stub */
:root{
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141B2B; --muted:#5F6B80; --line:#DCE1EA;
  --river:#2456C9; --river-soft:#E6EDFB; --chili:#D2462A; --chili-soft:#FBE9E4; --ok:#1E8A5A;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif;
  --f-ko:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131D; --surface:#161D2B; --ink:#E8ECF4; --muted:#93A0B6; --line:#273145;
  --river:#7FA6FF; --river-soft:#1C2A4A; --chili:#FF8A6E; --chili-soft:#3A2019; --ok:#5FD39C; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E131D; --surface:#161D2B; --ink:#E8ECF4; --muted:#93A0B6; --line:#273145;
  --river:#7FA6FF; --river-soft:#1C2A4A; --chili:#FF8A6E; --chili-soft:#3A2019; --ok:#5FD39C; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
a{color:var(--river)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--river);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:720px;margin:0 auto;padding:12px 16px;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:20px;letter-spacing:.02em}
.route{font-family:var(--f-mono);font-size:12px;color:var(--muted);letter-spacing:.08em}
.count{margin-left:auto;font-size:12px;color:var(--chili);font-weight:700}
h2{font-family:var(--f-display);font-weight:400;font-size:22px;margin:24px 0 4px;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.panel[hidden]{display:none}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px dashed var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(6,1fr)}
nav.tabs button{background:none;border:0;padding:10px 0 12px;min-width:0;white-space:nowrap;letter-spacing:-.02em;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);cursor:pointer;font-size:11px;font-weight:500}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-selected="true"]{color:var(--river)}

/* schedule */
.daychips{display:flex;gap:8px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none}
.daychips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:13px}
.daychips button b{font-family:var(--f-mono);margin-right:6px}
.day{scroll-margin-top:72px}
.dayhead{display:flex;align-items:baseline;gap:10px;margin:28px 0 10px;flex-wrap:wrap}
.dayhead .d{font-family:var(--f-mono);font-weight:700;font-size:26px;color:var(--river)}
.dayhead .t{font-family:var(--f-display);font-size:18px}
.dayhead .today{font-size:11px;background:var(--chili);color:var(--surface);border-radius:4px;padding:1px 6px;font-weight:700}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ev{display:grid;grid-template-columns:64px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.ev.now{border-color:var(--chili);box-shadow:0 0 0 2px var(--chili-soft)}
.ev .time{font-family:var(--f-mono);font-size:13px;font-weight:700;color:var(--river);line-height:1.35}
.ev .time small{display:block;color:var(--muted);font-weight:500}
.ev .body{min-width:0}
.ev .area{font-size:11px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.ev h3{margin:0 0 4px;font-size:16px;line-height:1.4;text-wrap:balance}
.ev h3 .ko{font-family:var(--f-ko);font-weight:400;color:var(--muted);font-size:13px;margin-left:6px}
.ev p{margin:0 0 6px;font-size:14px}
.ev .warn{color:var(--chili);font-weight:700;font-size:13px}
.links{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:4px 10px;border-radius:999px;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--bg)}
.chip.naver{background:#03C75A;border-color:#03C75A;color:#fff;font-weight:700}
.chip:hover{border-color:var(--river)}

/* expenses */
.settle{background:var(--ink);color:var(--bg);border-radius:14px;padding:16px;display:grid;gap:4px}
.settle .lbl{font-size:12px;opacity:.75;letter-spacing:.06em}
.settle .big{font-family:var(--f-display);font-size:24px;line-height:1.3}
.settle .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.settle .sm{font-size:12px;opacity:.8}
.form{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:16px;display:grid;gap:12px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.form input[type=text],.form input[type=number],.form select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px;font-size:16px;min-width:0}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:10px 6px;cursor:pointer;font-weight:700;font-size:14px}
.seg button small{display:block;font-weight:400;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--river);color:var(--surface)}
.seg button[aria-pressed="true"] small{color:var(--surface);opacity:.85}
.check{display:flex!important;align-items:center;gap:8px;font-weight:500!important;color:var(--ink)!important;font-size:13px!important}
.photo-in{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.photo-in .prev{width:56px;height:56px;border-radius:8px;object-fit:cover;border:1px solid var(--line)}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer;background:var(--river);color:var(--surface)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:12px;color:var(--muted)}
.tablewrap{overflow-x:auto;margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table.ex{width:100%;border-collapse:collapse;font-size:13px;min-width:420px}
table.ex th{font-size:11px;letter-spacing:.06em;color:var(--muted);text-align:left;padding:10px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap}
table.ex td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
table.ex td.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
table.ex th.r{text-align:right}
table.ex tfoot td{font-weight:700;border-bottom:0}
.cat{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:4px;background:var(--river-soft);color:var(--river)}
.memo{display:block;margin-top:2px}
.meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap}
.thumb{width:40px;height:40px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.del{background:none;border:0;color:var(--muted);font-size:12px;cursor:pointer;padding:2px 0;text-decoration:underline}
.del.confirm{color:var(--chili);font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted);font-size:13px}
.rate{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;margin-top:12px;color:var(--muted)}
.rate input{width:90px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;font-family:var(--f-mono)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.lightbox img{max-height:90%;border-radius:8px}

/* flight & hotel */
.pass{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px}
.pass .hd{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;background:var(--river);color:var(--surface);font-size:12px;font-weight:700;letter-spacing:.06em;gap:8px;flex-wrap:wrap}
.pass .hd.back{background:var(--ink);color:var(--bg)}
.pass .mid{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:16px}
.pass .ap{font-family:var(--f-mono);font-size:30px;font-weight:700;line-height:1}
.pass .tm{font-family:var(--f-mono);font-size:18px;font-weight:700}
.pass .nm{font-size:12px;color:var(--muted)}
.pass .arr{text-align:center;color:var(--muted);font-size:12px;font-family:var(--f-mono)}
.pass .r{text-align:right}
.pass .ft{border-top:1px dashed var(--line);padding:10px 16px;display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.pass .ft b{color:var(--ink);font-family:var(--f-mono)}
.note{background:var(--chili-soft);color:var(--ink);border-radius:10px;padding:10px 12px;font-size:13px;margin:0 0 14px}
.note b{color:var(--chili)}
.hotel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.addr{font-family:var(--f-mono);font-size:14px;margin:6px 0;word-break:break-word}
.copy{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer}

/* links */
.lgroup{margin-bottom:18px}
.lgroup h4{font-size:12px;letter-spacing:.08em;color:var(--muted);margin:0 0 8px}
.lcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.lcard{display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-decoration:none;color:var(--ink)}
.lcard b{display:block;font-size:14px}
.lcard span{font-size:12px;color:var(--muted)}
.lcard:hover{border-color:var(--river)}

/* food */
.farea{scroll-margin-top:72px;margin:22px 0 8px}
.farea h3{font-family:var(--f-display);font-weight:400;font-size:17px;margin:0}
.farea p{margin:2px 0 0;color:var(--muted);font-size:12px}
.flist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.fcard.star{border-color:var(--chili);background:var(--chili-soft)}
.badge{display:inline-block;margin-left:6px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;background:var(--ink);color:var(--bg);vertical-align:1px}
.fcard .gen{font-size:11px;font-weight:700;color:var(--chili);letter-spacing:.04em}
.fcard b{display:block;font-size:15px;line-height:1.4}
.fcard .ko{font-family:var(--f-ko);color:var(--muted);font-size:13px}
.fcard p{margin:4px 0 0;font-size:13px}
/* phrases */
.pcats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.pcats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer}
.pcats button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.plist{display:flex;flex-direction:column;gap:8px}
.ph{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 10px;align-items:center}
.ph .ja{font-size:13px;color:var(--muted);grid-column:1/-1}
.ph .ko{font-family:var(--f-ko);font-size:20px;line-height:1.35;min-width:0}
.ph .kana{font-size:12px;color:var(--river);grid-column:1/-1}
.ph button{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;grid-row:2;grid-column:2}
.show{position:fixed;inset:0;background:var(--surface);z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;gap:16px;cursor:pointer}
.show .k{font-family:var(--f-ko);font-size:clamp(34px,10vw,64px);line-height:1.3;word-break:keep-all}
.show .j{color:var(--muted)}
/* lock */
body.locked header.top,body.locked main,body.locked nav.tabs{display:none}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding-inline:16px;padding-block:24px}
body:not(.locked) .gate{display:none}
.gate form{width:100%;max-width:340px;display:grid;gap:14px;text-align:center}
.gate img{width:88px;height:88px;border-radius:20px;margin:0 auto}
.gate h1{font-family:var(--f-display);font-weight:400;font-size:26px;margin:0}
.gate p{margin:0;color:var(--muted);font-size:13px}
.gate input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;font-size:18px;text-align:center;font-family:var(--f-mono);letter-spacing:.2em}
.gate .err{color:var(--chili);font-weight:700;min-height:1.4em}
@media (prefers-reduced-motion:no-preference){.ev,.lcard,.chip{transition:border-color .15s}}
</style>
</head>
<body>
<div class="gate" id="gate">
  <form id="gateForm" autocomplete="off">
    <img src="apple-touch-icon.png" alt="">
    <h1>ソウル旅</h1>
    <p>10/9–10/12 · パスワードを入力してください</p>
    <label for="gatePw" class="status" style="position:absolute;left:-9999px">パスワード</label>
    <input id="gatePw" type="password" inputmode="text" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="••••••" required>
    <button class="btn" type="submit">ひらく</button>
    <p class="err" id="gateErr" aria-live="polite"></p>
  </form>
</div>

<div id="app"></div>

const d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const g=id=>document.getElementById(id);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
async function open(pw){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:d(E.salt),iterations:E.it,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:d(E.iv)},key,d(E.ct));
  const o=JSON.parse(new TextDecoder().decode(pt));
  g('app').innerHTML=o.html; document.body.classList.remove('locked');
  const s=document.createElement('script'); s.textContent=o.js; document.body.appendChild(s);
}
document.body.classList.add('locked');
const saved=ls.get('pw');
if(saved){open(saved).catch(()=>ls.del('pw'))}
g('gateForm').addEventListener('submit',async e=>{
  e.preventDefault(); const pw=g('gatePw').value.trim(); g('gateErr').textContent='確認中…';
  try{await open(pw); ls.set('pw',pw); g('gateErr').textContent=''}
  catch(_){g('gateErr').textContent='パスワードが違います'; g('gatePw').select()}
});
})();
</script>
